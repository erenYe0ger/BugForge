<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BugForge - AI bug bounty and fixer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // The `ink` and `ember` colours and the `mono` font family are declared
      // here rather than repeated as arbitrary values in classes. Anything
      // referenced here is available to Tailwind's scanner in index.html.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: { bg: '#0d1117', panel: '#161b22', line: '#30363d' },
              ember: '#f97316',
            },
            fontFamily: {
              mono: ['ui-monospace', 'Cascadia Code', 'Consolas', 'monospace'],
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-ink-bg text-slate-200 antialiased">
    <header
      class="flex flex-wrap items-baseline gap-x-4 gap-y-1 border-b border-ink-line px-6 py-4"
    >
      <h1 class="text-xl font-bold tracking-tight">
        <span class="text-ember">Bug</span>Forge
      </h1>
      <p class="text-slate-500 text-sm">
        The Hunter finds. The Coder fixes.
      </p>
    </header>

    <main class="mx-auto flex max-w-[1600px] flex-col gap-6 p-6">
      <!--
        The input section. `id="input"` is not referenced from JavaScript; it
        exists as a structural landmark only.
      -->
      <section class="grid gap-3">
        <div class="flex items-center gap-3">
          <label class="text-slate-500 text-sm" for="language">Language</label>
          <select
            id="language"
            class="rounded-md border border-ink-line bg-ink-panel px-3 py-2 text-sm outline-none focus:border-ember"
          >
            <!-- Populated by main.js so the list has one source of truth. -->
          </select>
          <button
            id="forge"
            type="button"
            class="ml-auto rounded-md bg-ember px-4 py-2 text-sm font-semibold text-stone-900 transition-colors hover:bg-orange-400 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Forge
          </button>
        </div>

        <textarea
          id="code"
          spellcheck="false"
          placeholder="Paste your buggy code here..."
          class="min-h-72 w-full resize-y rounded-lg border border-ink-line bg-ink-panel p-4 font-mono text-[13px] leading-relaxed outline-none placeholder:text-slate-600 focus:border-ember"
        ></textarea>

        <!--
          The app's only error surface. main.js colours it red on failure and
          also uses it for progress messages, so it is styled as data rather
          than decoration.
        -->
        <p
          id="status"
          role="status"
          aria-live="polite"
          class="min-h-5 text-slate-500 text-sm"
        ></p>
      </section>

      <!--
        The results panel. Toggled by setting el.results.hidden in main.js.

        `[&[hidden]]:hidden` is required, not decoration. Tailwind's `grid`
        class sets `display: grid`, and a class rule outranks the browser's
        default `[hidden] { display: none }`. Without this variant the panel
        renders as an empty box on page load and every `.hidden` assignment
        silently does nothing. That bug also shipped once.
      -->
      <section
        id="results"
        hidden
        class="grid gap-6 lg:grid-cols-2 [&[hidden]]:hidden"
      >
        <!-- Left column: the Hunter's findings. -->
        <div class="grid min-w-0 content-start gap-3">
          <h2 class="flex items-center gap-2 text-base font-semibold">
            The Hunter
            <span
              id="bug-count"
              class="rounded-full border border-ink-line px-2 py-0.5 text-[11px] font-semibold text-slate-500"
            ></span>
          </h2>
          <ul
            id="bugs"
            class="grid max-h-[60vh] gap-2 overflow-y-auto"
          >
            <!-- Cards built by render.js using textContent, never innerHTML. -->
          </ul>
        </div>

        <!-- Right column: the Coder's output. -->
        <div class="grid min-w-0 content-start gap-3">
          <div class="flex items-center justify-between gap-3">
            <h2 class="text-base font-semibold">The Coder</h2>
            <button
              id="copy"
              type="button"
              class="rounded-md border border-ink-line bg-ink-panel px-3 py-1.5 text-sm font-semibold transition-colors hover:border-ember disabled:cursor-not-allowed disabled:opacity-50"
            >
              Copy
            </button>
          </div>
          <pre
            class="max-h-[60vh] overflow-auto rounded-lg border border-ink-line bg-ink-panel p-4 font-mono text-[13px] leading-relaxed"
          ><code id="fixed"></code></pre>
        </div>
      </section>
    </main>

    <!--
      type="module" is what lets the client be split across public/js/ with
      native import/export. No bundler, no build step, nothing to install.
    -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
